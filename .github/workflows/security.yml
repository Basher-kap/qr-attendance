name: Checks and security

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  app:
    name: Types, lint, build, security check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npx eslint -c ./eslint.config.js "./src*/**/*.{ts,js,cjs,mjs,vue}"
      - run: npm run build
      # Also scans the built files for secrets, and fails on high/critical advisories.
      - run: npm run security:check

  database:
    name: Database security test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v7
      - run: bash supabase/tests/run-local.sh
